<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0c1022"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glowing Brain & Neural Circuitry -->
  <g filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M 235 150 C 205 130 150 145 140 185 C 130 220 145 240 155 255 C 135 270 130 305 150 335 C 165 358 195 375 235 375 L 235 150 Z" 
          fill="none" stroke="url(#brainGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Hemisphere -->
    <path d="M 277 150 C 307 130 362 145 372 185 C 382 220 367 240 357 255 C 377 270 382 305 362 335 C 347 358 317 375 277 375 L 277 150 Z" 
          fill="none" stroke="url(#brainGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner Neural Gyri / Lobes -->
    <path d="M 205 200 C 185 205 170 230 185 250 C 200 270 220 265 235 260" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 307 200 C 327 205 342 230 327 250 C 312 270 292 265 277 260" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round"/>
          
    <path d="M 195 295 C 180 310 195 335 220 335" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 317 295 C 332 310 317 335 292 335" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Central ECG / Neural Heartbeat Wave -->
    <path d="M 90 256 L 160 256 L 185 210 L 215 300 L 256 160 L 297 340 L 327 230 L 352 275 L 370 256 L 422 256" 
          fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neural Synapse Dots -->
    <circle cx="256" cy="160" r="10" fill="#a855f7"/>
    <circle cx="297" cy="340" r="8" fill="#06b6d4"/>
    <circle cx="215" cy="300" r="8" fill="#ec4899"/>
    <circle cx="185" cy="210" r="7" fill="#6366f1"/>
    <circle cx="327" cy="230" r="7" fill="#38bdf8"/>
  </g>
</svg>
